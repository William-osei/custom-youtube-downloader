name: Linux and macOS desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-launch:
    name: Build and launch on ${{ matrix.rid }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, host: ubuntu-24.04 }
          - { rid: linux-arm64, host: ubuntu-24.04-arm }
          - { rid: osx-x64, host: macos-15-intel }
          - { rid: osx-arm64, host: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install package builder and downloader
        run: python -m pip install Pillow 'yt-dlp[default]'
      - name: Install Linux desktop and media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 ffmpeg espeak-ng desktop-file-utils
      - name: Install native macOS codecs
        if: runner.os == 'macOS'
        id: codecs
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cyd-codecs
          create-args: -c conda-forge ffmpeg
          init-shell: none
      - name: Enable macOS codecs
        if: runner.os == 'macOS'
        run: echo "${{ steps.codecs.outputs.environment-path }}/bin" >> "$GITHUB_PATH"
      - name: Publish self-contained app
        env:
          RID: ${{ matrix.rid }}
        run: |
          single=false
          if [[ "$RID" == osx-* ]]; then single=true; fi
          dotnet publish Portable/Downloader.csproj -c Release -r "$RID" --self-contained true -p:PublishSingleFile="$single" -o "$RUNNER_TEMP/publish"
      - name: Package and launch
        env:
          RID: ${{ matrix.rid }}
        run: |
          version=$(dotnet msbuild Portable/Downloader.csproj -getProperty:Version -nologo)
          python packaging/package.py --rid "$RID" --publish "$RUNNER_TEMP/publish" --version "$version" --output "$RUNNER_TEMP/release"
          sh packaging/test-package.sh "$RUNNER_TEMP"/release/*
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
