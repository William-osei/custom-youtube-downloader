name: Linux and macOS desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published version to test, such as v1.4.0 (leave empty to build from source)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-and-launch:
    name: Package checks on ${{ matrix.rid }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, host: ubuntu-24.04 }
          - { rid: linux-arm64, host: ubuntu-24.04-arm }
          - { rid: osx-x64, host: macos-15-intel }
          - { rid: osx-arm64, host: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify published package
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RID: ${{ matrix.rid }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a release tag in vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          extension=tar.gz
          if [[ "$RID" == osx-* ]]; then extension=zip; fi
          name="Custom-YouTube-Downloader-${RELEASE_TAG#v}-$RID.$extension"
          digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -er --arg tag "$RELEASE_TAG" --arg name "$name" '
              select(.tag_name == $tag and .draft == false)
              | [.assets[] | select(.name == $name and .state == "uploaded")]
              | select(length == 1) | .[0].digest | strings
              | select(test("^sha256:[0-9a-f]{64}$"))')
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/release"
          printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/release/$name" | shasum -a 256 -c -
      - uses: actions/setup-dotnet@v6
        if: inputs.release_tag == ''
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        if: inputs.release_tag == ''
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        if: inputs.release_tag == ''
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install package builder and downloader
        if: inputs.release_tag == ''
        run: python -m pip install Pillow 'yt-dlp[default]'
      - name: Install Linux desktop and media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 ffmpeg espeak-ng desktop-file-utils
      - name: Install native macOS codecs
        if: runner.os == 'macOS'
        id: codecs
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cyd-codecs
          create-args: -c conda-forge ffmpeg
          init-shell: none
      - name: Enable macOS codecs
        if: runner.os == 'macOS'
        run: echo "${{ steps.codecs.outputs.environment-path }}/bin" >> "$GITHUB_PATH"
      - name: Publish self-contained app
        if: inputs.release_tag == ''
        env:
          RID: ${{ matrix.rid }}
        run: |
          single=false
          if [[ "$RID" == osx-* ]]; then single=true; fi
          dotnet publish Portable/Downloader.csproj -c Release -r "$RID" --self-contained true -p:PublishSingleFile="$single" -o "$RUNNER_TEMP/publish"
      - name: Build package
        if: inputs.release_tag == ''
        env:
          RID: ${{ matrix.rid }}
        run: |
          version=$(dotnet msbuild Portable/Downloader.csproj -getProperty:Version -nologo)
          python packaging/package.py --rid "$RID" --publish "$RUNNER_TEMP/publish" --version "$version" --output "$RUNNER_TEMP/release"
      - name: Launch desktop and test media
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: sh packaging/test-package.sh "$RUNNER_TEMP"/release/* "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v7
        if: inputs.release_tag == ''
        with:
          name: desktop-${{ matrix.rid }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          compression-level: 0
